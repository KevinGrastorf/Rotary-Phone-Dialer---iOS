<svg xmlns="http://www.w3.org/2000/svg" viewBox="-70 0 940 1010" width="940" height="1010">
  <defs>
    <!-- plastic body shading -->
    <linearGradient id="bodyG" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#cdbbab"/>
      <stop offset="0.12" stop-color="#e6d6c6"/>
      <stop offset="0.55" stop-color="#ecdccc"/>
      <stop offset="0.9" stop-color="#d9c7b6"/>
      <stop offset="1" stop-color="#bfac9b"/>
    </linearGradient>
    <linearGradient id="bodyTop" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#d4c2b1"/>
      <stop offset="1" stop-color="#e8d8c8"/>
    </linearGradient>
    <linearGradient id="handG" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f3e5d6"/>
      <stop offset="0.35" stop-color="#e9d8c7"/>
      <stop offset="0.8" stop-color="#d6c3b1"/>
      <stop offset="1" stop-color="#c2ae9c"/>
    </linearGradient>
    <radialGradient id="cupG" cx="0.4" cy="0.35" r="0.75">
      <stop offset="0" stop-color="#f1e3d4"/>
      <stop offset="0.6" stop-color="#e0cebd"/>
      <stop offset="1" stop-color="#c4b09e"/>
    </radialGradient>
    <linearGradient id="cupRim" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#cfbba8"/>
      <stop offset="0.7" stop-color="#bba794"/>
      <stop offset="1" stop-color="#a28d7a"/>
    </linearGradient>
    <linearGradient id="prongG" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#d0bead"/>
      <stop offset="0.4" stop-color="#e9d9c9"/>
      <stop offset="1" stop-color="#c8b5a4"/>
    </linearGradient>
    <radialGradient id="ringG" cx="0.45" cy="0.4" r="0.65">
      <stop offset="0" stop-color="#e7d4bd"/>
      <stop offset="0.85" stop-color="#dcc8b0"/>
      <stop offset="1" stop-color="#c9b49c"/>
    </radialGradient>
    <radialGradient id="wheelG" cx="0.4" cy="0.35" r="0.7">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.55"/>
      <stop offset="0.6" stop-color="#e9dfd3" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#a99887" stop-opacity="0.45"/>
    </radialGradient>
    <radialGradient id="holeG" cx="0.5" cy="0.45" r="0.6">
      <stop offset="0" stop-color="#d8c7b4"/>
      <stop offset="0.75" stop-color="#cdb9a4"/>
      <stop offset="1" stop-color="#9c8977"/>
    </radialGradient>
    <radialGradient id="cardG" cx="0.45" cy="0.4" r="0.7">
      <stop offset="0" stop-color="#f7f3ee"/>
      <stop offset="1" stop-color="#e4dcd2"/>
    </radialGradient>
    <linearGradient id="steelG" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#e3e5e7"/>
      <stop offset="0.5" stop-color="#a7abaf"/>
      <stop offset="1" stop-color="#6f7378"/>
    </linearGradient>

    <linearGradient id="hsSide" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e9d9c8"/>
      <stop offset="0.45" stop-color="#e2d1bf"/>
      <stop offset="0.8" stop-color="#d3bfac"/>
      <stop offset="1" stop-color="#bba795"/>
    </linearGradient>
    <linearGradient id="hsTop" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f5eadd"/>
      <stop offset="1" stop-color="#e9dac9"/>
    </linearGradient>
    <radialGradient id="capHi" cx="0.45" cy="0.3" r="0.6">
      <stop offset="0" stop-color="#fffaf3" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#fffaf3" stop-opacity="0"/>
    </radialGradient>
    <filter id="groundShadow" x="-60%" y="-200%" width="220%" height="500%">
      <feGaussianBlur stdDeviation="22"/>
    </filter>
    <filter id="soft" x="-30%" y="-100%" width="160%" height="300%">
      <feGaussianBlur stdDeviation="8"/>
    </filter>
    <filter id="drop" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="10" stdDeviation="9" flood-color="#3b2a1c" flood-opacity="0.35"/>
    </filter>
    <filter id="dropSm" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="2" dy="4" stdDeviation="3" flood-color="#3b2a1c" flood-opacity="0.35"/>
    </filter>
    <filter id="inner" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="3" result="b"/>
      <feOffset dy="3" result="o"/>
      <feComposite in="o" in2="SourceAlpha" operator="arithmetic" k2="-1" k3="1" result="sh"/>
      <feFlood flood-color="#4a3626" flood-opacity="0.55"/>
      <feComposite in2="sh" operator="in"/>
      <feComposite in2="SourceGraphic" operator="over"/>
    </filter>
    <clipPath id="handClip">
      <path d="M-22 140 Q-28 56 60 52 L740 52 Q828 56 822 140 L818 238 Q760 262 690 236 Q650 214 610 205 L190 205 Q150 214 110 236 Q40 262 -18 238 Z"/>
    </clipPath>
  </defs>

  <!-- ===== Ground shadows ===== -->
  <ellipse cx="400" cy="955" rx="330" ry="38" fill="#3b2a1c" opacity="0.45" filter="url(#groundShadow)"/>
  <ellipse cx="400" cy="945" rx="290" ry="16" fill="#2a1d12" opacity="0.55" filter="url(#soft)"/>
  <path d="M-10 330 Q60 400 150 390 L170 300 Z" fill="#3b2a1c" opacity="0.28" filter="url(#groundShadow)"/>
  <path d="M810 330 Q740 400 650 390 L630 300 Z" fill="#3b2a1c" opacity="0.28" filter="url(#groundShadow)"/>

  <!-- ===== Feet ===== -->
  <rect x="150" y="915" width="80" height="22" rx="8" fill="#2e2a27"/>
  <rect x="570" y="915" width="80" height="22" rx="8" fill="#2e2a27"/>

  <!-- ===== Base / body ===== -->
  <g filter="url(#drop)">
    <!-- rear cradle block -->
    <path d="M195 175 L605 175 Q625 175 628 195 L640 380 L160 380 L172 195 Q175 175 195 175 Z" fill="url(#bodyTop)"/>
    <!-- front sloped face -->
    <path d="M150 385 Q152 360 178 358 L622 358 Q648 360 650 385 L668 890 Q670 930 630 932 L170 932 Q130 930 132 890 Z" fill="url(#bodyG)"/>
  </g>
  <!-- subtle body edge highlights -->
  <path d="M178 362 L622 362" stroke="#f6ebdf" stroke-width="3" opacity="0.8"/>
  <path d="M150 400 L134 890" stroke="#f3e7da" stroke-width="2" opacity="0.5"/>
  <path d="M168 925 L632 925" stroke="#a8927f" stroke-width="3" opacity="0.6"/>
  <!-- cradle recess between prongs -->
  <rect x="285" y="200" width="230" height="160" rx="6" fill="#cfbcaa"/>

  <!-- ===== Handset (sits behind the prongs) ===== -->
  <!-- back tab of the cradle peeking out behind the handle -->
  <path d="M248 48 Q250 38 262 38 L548 38 Q560 38 562 48 L562 60 L248 60 Z" fill="#ddccbb" stroke="#c7b4a2" stroke-width="1.2"/>
  <!-- shadows the handset throws onto the base and table -->
  <path d="M230 188 L570 188 L566 232 L234 232 Z" fill="#2e2015" opacity="0.45" filter="url(#soft)"/>
  <ellipse cx="80" cy="372" rx="125" ry="30" fill="#2e2015" opacity="0.35" filter="url(#groundShadow)"/>
  <ellipse cx="720" cy="372" rx="125" ry="30" fill="#2e2015" opacity="0.35" filter="url(#groundShadow)"/>

  <g filter="url(#drop)">
    <!-- undersides of the ear and mouth cups (the rim lip seen below each end) -->
    <path d="M-2 280 Q6 368 96 374 Q176 372 214 306 L210 262 L-10 262 Z" fill="url(#cupRim)"/>
    <path d="M590 262 L812 262 L806 286 Q796 372 706 378 Q626 376 588 306 Z" fill="url(#cupRim)"/>
    <!-- one-piece handset body: long handle flaring into two rounded end caps -->
    <path id="hsBody" d="M42 74 Q250 40 440 36 Q650 41 790 70 Q838 82 840 142 L842 236 Q840 304 790 324
             Q722 340 652 318 Q616 304 602 262 Q592 206 560 196 L240 196 Q208 206 198 262
             Q184 304 148 320 Q78 342 22 322 Q-26 300 -28 222 L-26 142 Q-22 84 42 74 Z" fill="url(#hsSide)"/>
  </g>
  <!-- top face of the handle, catching the light -->
  <path d="M42 74 Q250 40 440 36 Q650 41 790 70 Q836 80 839 132 Q800 162 738 158 Q600 150 440 152
           Q262 150 122 158 Q2 166 -25 136 Q-20 84 42 74 Z" fill="url(#hsTop)"/>
  <!-- crease where the top face turns down into the front -->
  <path d="M-25 136 Q2 166 122 158 Q262 150 440 152 Q600 150 738 158 Q800 162 839 132" fill="none" stroke="#bfab98" stroke-width="2.5" opacity="0.75"/>
  <path d="M-23 140 Q4 170 122 162 Q262 154 440 156 Q600 154 738 162 Q800 166 839 136" fill="none" stroke="#f7ede2" stroke-width="1.5" opacity="0.5"/>
  <!-- rounded end caps: soft highlight on the upper shoulder, shade toward the bottom -->
  <ellipse cx="50" cy="215" rx="110" ry="95" fill="url(#capHi)"/>
  <ellipse cx="750" cy="218" rx="110" ry="95" fill="url(#capHi)"/>
  <path d="M-20 280 Q0 330 70 334 Q140 330 178 296" fill="none" stroke="#b09a87" stroke-width="3" opacity="0.6"/>
  <path d="M622 296 Q660 332 730 336 Q800 332 820 282" fill="none" stroke="#b09a87" stroke-width="3" opacity="0.6"/>
  <!-- seam where each end cap meets its cup lip -->
  <path d="M198 262 Q184 304 148 320 Q78 342 22 322 Q-24 302 -27 250" fill="none" stroke="#9f8a77" stroke-width="2.5" opacity="0.8"/>
  <path d="M602 262 Q616 304 652 318 Q722 340 790 324 Q838 304 841 250" fill="none" stroke="#9f8a77" stroke-width="2.5" opacity="0.8"/>
  <!-- glint along the top edge -->
  <path d="M70 70 Q250 44 440 41 Q640 45 770 68" fill="none" stroke="#fffaf3" stroke-width="4" stroke-linecap="round" opacity="0.75"/>
  <path d="M828 110 Q834 150 830 200" fill="none" stroke="#fff6ec" stroke-width="5" stroke-linecap="round" opacity="0.55"/>

  <!-- ===== Cradle prongs (in front of the handset) ===== -->
  <g filter="url(#dropSm)">
    <path d="M212 196 Q212 180 228 180 L274 180 Q290 180 292 196 L304 370 L204 370 Z" fill="url(#prongG)"/>
    <path d="M508 196 Q510 180 526 180 L572 180 Q588 180 588 196 L596 370 L496 370 Z" fill="url(#prongG)"/>
  </g>
  <path d="M222 188 L282 188" stroke="#f5eadf" stroke-width="3" stroke-linecap="round" opacity="0.8"/>
  <path d="M518 188 L578 188" stroke="#f5eadf" stroke-width="3" stroke-linecap="round" opacity="0.8"/>
  <!-- notch on the inner face of each prong -->
  <path d="M286 200 L296 300" stroke="#b9a593" stroke-width="3" opacity="0.6"/>
  <path d="M514 200 L504 300" stroke="#b9a593" stroke-width="3" opacity="0.6"/>

  <!-- ===== Dial ===== -->
  <g transform="translate(400 600)" display="none">
    <!-- recess shadow under ring -->
    <circle r="252" fill="#a8937f" opacity="0.55" filter="url(#soft)"/>
    <circle r="245" fill="url(#ringG)" stroke="#c7b29b" stroke-width="2"/>
    <circle r="243" fill="none" stroke="#f3e6d6" stroke-width="2" opacity="0.6"/>

    <!-- clear finger wheel -->
    <circle r="178" fill="#cfbba4" opacity="0.6"/>
    <circle r="178" fill="url(#wheelG)" stroke="#f9f4ee" stroke-width="2" stroke-opacity="0.8"/>
    <circle r="176" fill="none" stroke="#8d7b6a" stroke-width="1.5" opacity="0.5"/>

    <!-- finger holes: angles from 1 (−39°) stepping −30° around to 0 (+51°) -->
    <g>
      <g transform="rotate(-39) translate(128 0)"><circle r="33" fill="url(#holeG)" filter="url(#inner)"/><circle r="5" fill="#1d1814"/><circle r="33" fill="none" stroke="#fff" stroke-opacity="0.5" stroke-width="1.5"/></g>
      <g transform="rotate(-69) translate(128 0)"><circle r="33" fill="url(#holeG)" filter="url(#inner)"/><circle r="5" fill="#1d1814"/><circle r="33" fill="none" stroke="#fff" stroke-opacity="0.5" stroke-width="1.5"/></g>
      <g transform="rotate(-99) translate(128 0)"><circle r="33" fill="url(#holeG)" filter="url(#inner)"/><circle r="5" fill="#1d1814"/><circle r="33" fill="none" stroke="#fff" stroke-opacity="0.5" stroke-width="1.5"/></g>
      <g transform="rotate(-129) translate(128 0)"><circle r="33" fill="url(#holeG)" filter="url(#inner)"/><circle r="5" fill="#1d1814"/><circle r="33" fill="none" stroke="#fff" stroke-opacity="0.5" stroke-width="1.5"/></g>
      <g transform="rotate(-159) translate(128 0)"><circle r="33" fill="url(#holeG)" filter="url(#inner)"/><circle r="5" fill="#1d1814"/><circle r="33" fill="none" stroke="#fff" stroke-opacity="0.5" stroke-width="1.5"/></g>
      <g transform="rotate(171) translate(128 0)"><circle r="33" fill="url(#holeG)" filter="url(#inner)"/><circle r="5" fill="#1d1814"/><circle r="33" fill="none" stroke="#fff" stroke-opacity="0.5" stroke-width="1.5"/></g>
      <g transform="rotate(141) translate(128 0)"><circle r="33" fill="url(#holeG)" filter="url(#inner)"/><circle r="5" fill="#1d1814"/><circle r="33" fill="none" stroke="#fff" stroke-opacity="0.5" stroke-width="1.5"/></g>
      <g transform="rotate(111) translate(128 0)"><circle r="33" fill="url(#holeG)" filter="url(#inner)"/><circle r="5" fill="#1d1814"/><circle r="33" fill="none" stroke="#fff" stroke-opacity="0.5" stroke-width="1.5"/></g>
      <g transform="rotate(81) translate(128 0)"><circle r="33" fill="url(#holeG)" filter="url(#inner)"/><circle r="5" fill="#1d1814"/><circle r="33" fill="none" stroke="#fff" stroke-opacity="0.5" stroke-width="1.5"/></g>
      <g transform="rotate(51) translate(128 0)"><circle r="33" fill="url(#holeG)" filter="url(#inner)"/><circle r="5" fill="#1d1814"/><circle r="33" fill="none" stroke="#fff" stroke-opacity="0.5" stroke-width="1.5"/></g>
    </g>

    <!-- wheel glare -->
    <path d="M-120 -110 A165 165 0 0 1 60 -158" stroke="#ffffff" stroke-width="10" fill="none" stroke-linecap="round" opacity="0.35"/>

    <!-- center number card -->
    <circle r="92" fill="#8f7d6c" opacity="0.4" filter="url(#soft)"/>
    <circle r="88" fill="url(#cardG)" stroke="#bfb3a6" stroke-width="2"/>
    <circle r="80" fill="none" stroke="#d3c9bd" stroke-width="1"/>

    <!-- finger stop -->
    <g transform="rotate(24)" filter="url(#dropSm)">
      <path d="M118 -6 Q150 -14 176 -10 L184 -26 L196 -20 L192 6 Q180 18 160 20 L124 12 Q112 4 118 -6 Z" fill="url(#steelG)"/>
      <path d="M122 -6 Q150 -12 178 -8" stroke="#fafafa" stroke-width="2" fill="none" opacity="0.8"/>
    </g>
  </g>
</svg>
